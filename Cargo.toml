[package]
name = "lazymise"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Vim-first terminal workbench for mise"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

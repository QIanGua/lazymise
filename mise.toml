# lazymise — Vim-first TUI workbench for mise
# Run `mise tasks` to list all available tasks.

[tools]
rust = "stable"

[env]
OUT_DIR = "{{config_root}}/outputs"
TIDY_ROOT_ALLOW = "target STRATEGY.md README.zh-CN.md"

[tasks.dev]
description = "Run lazymise in debug mode"
run = "cargo run"

[tasks.test]
description = "Run Rust unit and integration tests"
run = "cargo test"

[tasks.lint]
description = "Run clippy lints"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.build]
description = "Build release binary"
sources = ["src/**/*.rs", "Cargo.lock", "Cargo.toml"]
outputs = ["target/release/lazymise"]
cache = { enabled = true }
run = "cargo build --release"

[tasks.install]
description = "Install lazymise to ~/.cargo/bin"
depends = ["build"]
run = "cargo install --path . --locked"

[tasks.check]
description = "Run workspace hygiene, tests, and clippy"
depends = ["tidy", "test", "lint"]
